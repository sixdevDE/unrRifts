name: unrRifts
main: dev.sixdev.unrrifts.UnrRiftsPlugin
version: 1.0.0
api-version: '1.21'
authors: [sixdev]
softdepend: [Multiverse-Core, PlaceholderAPI]
commands:
  rift:
    description: Open unrRifts GUI
    usage: /rift
  unrrifts:
    description: Admin commands for unrRifts
    usage: /unrrifts help
    permission: unrrifts.admin

unrmapstartbuild:
  description: Start manual map build session
  usage: /unrmapstartbuild <name> <pve|pvp> [break:true|false]
  permission: unrrifts.admin
unrmapfinalize:
  description: Finalize manual map
  usage: /unrmapfinalize <name>
  permission: unrrifts.admin
unrmapsetbreak:
  description: Set allowBreak for active build session
  usage: /unrmapsetbreak <true|false>
  permission: unrrifts.admin
unrpspawn:
  description: Set player spawn for active map build
  usage: /unrpspawn
  permission: unrrifts.admin
unrmspawn:
  description: Add mob spawn marker
  usage: /unrmspawn <entityType> [level] [--no_block_break]
  permission: unrrifts.admin
unrlspawn:
  description: Add loot spawn marker
  usage: /unrlspawn [tier]
  permission: unrrifts.admin
unrbspawn:
  description: Set boss spawn marker
  usage: /unrbspawn <bossId>
  permission: unrrifts.admin
unrexfil:
  description: Add exfil marker
  usage: /unrexfil
  permission: unrrifts.admin
unrevent:
  description: Add event trigger marker
  usage: /unrevent <name>
  permission: unrrifts.admin
permissions:
  unrrifts.admin:
    default: op
